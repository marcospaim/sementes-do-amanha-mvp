<div class="campo">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="obrigatorio">· obrigatório</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="ajuda">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="erro">{{ error }}</div>{% endfor %}
</div>
